<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI活用レベル診断</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c14;
  --surface: #0d1520;
  --surface2: #111d2e;
  --border: #1a3a5c;
  --cyan: #00d4ff;
  --cyan-dim: rgba(0,212,255,0.15);
  --cyan-glow: rgba(0,212,255,0.4);
  --green: #00ff9d;
  --green-dim: rgba(0,255,157,0.12);
  --yellow: #ffd700;
  --orange: #ff8c00;
  --red: #ff4757;
  --text: #c8e0f0;
  --text-dim: #4a6a88;
  --text-bright: #e8f4ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  overflow-x: hidden;
  position: relative;
}

/* Animated grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Glow orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
.orb-1 { width: 400px; height: 400px; background: rgba(0,212,255,0.06); top: -100px; right: -100px; }
.orb-2 { width: 300px; height: 300px; background: rgba(0,255,157,0.05); bottom: -50px; left: -50px; }

.container {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
  padding: 0 16px;
}

/* ===== INTRO ===== */
#intro {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 0;
  gap: 28px;
  text-align: center;
}

.logo-ring {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  box-shadow: 0 0 24px var(--cyan-glow), inset 0 0 24px var(--cyan-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  animation: pulse-ring 2.5s ease-in-out infinite;
  position: relative;
}

.logo-ring::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(0,212,255,0.2);
  animation: spin 8s linear infinite;
}

@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 24px var(--cyan-glow), inset 0 0 24px var(--cyan-dim); }
  50% { box-shadow: 0 0 40px var(--cyan-glow), inset 0 0 40px var(--cyan-dim); }
}
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.intro-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 20px var(--cyan-glow);
  letter-spacing: 0.05em;
  line-height: 1.3;
}

.intro-sub {
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.8;
}

.intro-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--cyan);
  font-size: 0.72rem;
  padding: 5px 12px;
  border-radius: 20px;
  font-family: 'Orbitron', monospace;
  letter-spacing: 0.05em;
}

.scan-btn {
  background: transparent;
  border: 2px solid var(--cyan);
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
  font-size: 0.9rem;
  font-weight: 700;
  padding: 16px 48px;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 0.1em;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
  box-shadow: 0 0 16px var(--cyan-dim);
}

.scan-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.15), transparent);
  transition: left 0.4s;
}

.scan-btn:hover { background: var(--cyan-dim); box-shadow: 0 0 28px var(--cyan-glow); }
.scan-btn:hover::before { left: 100%; }
.scan-btn:active { transform: scale(0.98); }

/* ===== QUIZ ===== */
#quiz { display: none; flex-direction: column; padding: 20px 0; gap: 0; }

.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}

.hud-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--cyan);
  letter-spacing: 0.1em;
}

.progress-track {
  display: flex;
  gap: 4px;
}

.progress-pip {
  width: 20px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  transition: all 0.3s;
}
.progress-pip.done { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.progress-pip.active { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

.score-display {
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  color: var(--green);
  letter-spacing: 0.05em;
}

.q-number {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  margin-bottom: 10px;
}

.q-text {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-bright);
  line-height: 1.6;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cyan);
  border-radius: 4px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.85rem;
  padding: 14px 18px;
  border-radius: 4px;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  line-height: 1.5;
}

.opt-letter {
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--cyan);
  background: var(--cyan-dim);
  border: 1px solid rgba(0,212,255,0.3);
  width: 22px; height: 22px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

.opt-btn:hover { border-color: var(--cyan); background: var(--cyan-dim); color: var(--text-bright); transform: translateX(4px); }
.opt-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.opt-btn.correct .opt-letter { background: rgba(0,255,157,0.2); border-color: var(--green); color: var(--green); }
.opt-btn.wrong { border-color: var(--red); background: rgba(255,71,87,0.1); color: var(--red); opacity: 0.6; }
.opt-btn.wrong .opt-letter { color: var(--red); border-color: var(--red); background: rgba(255,71,87,0.15); }
.opt-btn:disabled { cursor: default; }

.feedback-box {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: 4px;
  font-size: 0.82rem;
  line-height: 1.6;
  display: none;
  animation: fadeIn 0.3s ease;
}
.feedback-box.show { display: block; }
.feedback-box.ok { background: var(--green-dim); border: 1px solid rgba(0,255,157,0.3); color: var(--green); }
.feedback-box.ng { background: rgba(255,71,87,0.08); border: 1px solid rgba(255,71,87,0.3); color: #ff8090; }

@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.next-btn {
  margin-top: 20px;
  width: 100%;
  background: transparent;
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  padding: 13px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  display: none;
}
.next-btn.show { display: block; }
.next-btn:hover { background: var(--cyan-dim); }

/* ===== RESULT ===== */
#result { display: none; flex-direction: column; padding: 24px 0 40px; gap: 20px; }

.result-header {
  text-align: center;
  padding: 24px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 3px solid var(--cyan);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}

.result-header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at top center, rgba(0,212,255,0.08) 0%, transparent 60%);
}

.result-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  margin-bottom: 8px;
}

.result-icon { font-size: 3rem; margin-bottom: 10px; display: block; }

.result-type {
  font-family: 'Orbitron', monospace;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--cyan);
  text-shadow: 0 0 16px var(--cyan-glow);
  margin-bottom: 6px;
  line-height: 1.3;
}

.result-sub {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 16px;
}

/* Score bar */
.score-bar-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}
.score-bar-track {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.score-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  box-shadow: 0 0 8px var(--cyan);
  transition: width 1s cubic-bezier(0.4,0,0.2,1);
  width: 0;
}
.score-text {
  font-family: 'Orbitron', monospace;
  font-size: 0.8rem;
  color: var(--green);
  white-space: nowrap;
}

/* Skill tags */
.result-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 18px;
}

.section-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.result-desc {
  font-size: 0.85rem;
  line-height: 1.8;
  color: var(--text);
}

.next-steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}

.step-item {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--text);
}

.step-num {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  color: var(--cyan);
  background: var(--cyan-dim);
  border: 1px solid rgba(0,212,255,0.3);
  width: 20px; height: 20px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

.retry-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'Orbitron', monospace;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  padding: 14px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.retry-btn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }

/* Loading bar animation */
.loading-bar {
  width: 100%;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
  margin-top: 8px;
}
.loading-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  animation: loading-anim 1s ease forwards;
}
@keyframes loading-anim { from{width:0} to{width:100%} }
</style>
</head>
<body>

<h1 style="position:relative; z-index:10; text-align:center;">
OEM DEMO
</h1>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">

  <!-- INTRO -->
  <div id="intro">
    <div class="logo-ring">🤖</div>
    <div class="intro-title">AI活用<br>レベル診断</div>
    <div class="intro-sub">
      5つの質問に答えて<br>あなたの現在のAI活用レベルを<br>スキャンします
    </div>
    <div class="intro-badges">
      <span class="badge">Q×5問</span>
      <span class="badge">約3分</span>
      <span class="badge">タイプ診断つき</span>
    </div>
    <button class="scan-btn" onclick="startQuiz()">▶ スキャン開始</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz">
    <div class="hud">
      <div class="hud-title">AI LEVEL SCAN</div>
      <div class="progress-track" id="progress-track"></div>
      <div class="score-display" id="score-display">PT: 0</div>
    </div>
    <div class="q-number" id="q-number">Q.1 / 5</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">NEXT ▶</button>
  </div>

  <!-- RESULT -->
  <div id="result">
    <div class="result-header">
      <div class="result-label">SCAN COMPLETE — YOUR AI TYPE</div>
      <span class="result-icon" id="result-icon"></span>
      <div class="result-type" id="result-type"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="score-bar-wrap">
        <div class="score-bar-track"><div class="score-bar-fill" id="score-bar-fill"></div></div>
        <div class="score-text" id="score-final"></div>
      </div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

    <div class="result-section">
      <div class="section-title">ANALYSIS</div>
      <div class="result-desc" id="result-desc"></div>
    </div>

    <div class="result-section">
      <div class="section-title">NEXT ACTIONS</div>
      <div class="next-steps" id="next-steps"></div>
    </div>

    <button class="retry-btn" onclick="restart()">↺ もう一度スキャンする</button>
  </div>

</div>

<script>
const QUESTIONS = [
  {
    text: "「生成AI」と聞いて、最もイメージに近いものはどれですか？",
    options: [
      "ChatGPTやGeminiのような会話AIのこと",
      "ロボットが自動で工場作業をするシステム",
      "Googleで検索するのと同じ仕組み",
      "AIが自動でプログラムを書いてくれるソフト"
    ],
    correct: 0,
    points: 10,
    feedback_ok: "正解！ChatGPT・Gemini・Claudeなどが代表例です。テキスト・画像・音声などを「生成」するAIの総称です。",
    feedback_ng: "生成AIとは、ChatGPTやGeminiのようにテキストや画像を新たに「生成」するAIの総称です。検索とは仕組みが異なります。"
  },
  {
    text: "ChatGPTに「いい感じにして」とだけ伝えて作業を頼んだとき、よく起こることは？",
    options: [
      "完璧な結果が返ってくる",
      "エラーになって動かない",
      "ぼんやりした回答や的外れな結果になりやすい",
      "AIが自動で意図を読んで最適化してくれる"
    ],
    correct: 2,
    points: 20,
    feedback_ok: "正解！AIへの指示（プロンプト）は具体的であるほど精度が上がります。「誰に・何を・どう」を明確に伝えるのがコツです。",
    feedback_ng: "AIは曖昧な指示が苦手です。「いい感じに」ではなく「○○向けに・200字で・箇条書きで」など具体的に伝えるほど精度が上がります。"
  },
  {
    text: "ChatGPTが返してきた情報をそのまま業務資料に使うとき、注意すべき点は？",
    options: [
      "特になし。AIは常に正確",
      "事実と異なる「ハルシネーション」が含まれる可能性がある",
      "文字数が多すぎて使いにくいことがある",
      "AIの著作権が心配なので使えない"
    ],
    correct: 1,
    points: 20,
    feedback_ok: "正解！AIが自信満々に間違いを返す「ハルシネーション」は要注意。数字・固有名詞・法律など重要情報は必ず一次ソースで確認を。",
    feedback_ng: "「ハルシネーション」に注意が必要です。AIは事実でない情報を自信ありげに生成することがあります。重要な情報は必ず原典で確認しましょう。"
  },
  {
    text: "化粧品の新商品企画に生成AIを使うとしたら、最も効果的な使い方はどれですか？",
    options: [
      "AIに全部任せて企画書を完成させる",
      "ターゲット層・コンセプト・キャッチコピー案の壁打ち相手として使う",
      "競合他社の非公開データを調べさせる",
      "AIは製品開発には使えないので使わない"
    ],
    correct: 1,
    points: 20,
    feedback_ok: "正解！AIは「ゼロから100を作る」より「0→1のアイデア出し・壁打ち」が得意です。人間の判断・経験と組み合わせるのがベストです。",
    feedback_ng: "AIは壁打ち・アイデア出しが最も得意な使い方です。全部任せるより、人間の判断と組み合わせるのが効果的。非公開情報は取得できません。"
  },
  {
    text: "NotebookLMというGoogleのAIツール、主な特徴は何でしょう？",
    options: [
      "自動でノートを手書き文字に変換してくれる",
      "アップロードした資料をもとにAIが質問に答えてくれる",
      "AIが自動的に会議の議事録を作成してくれる",
      "インターネット全体から情報を集めてまとめてくれる"
    ],
    correct: 1,
    points: 30,
    feedback_ok: "正解！今日の研修でも使います。自分の資料をアップするとAIがその内容をもとに回答・要約・スライド生成などをしてくれます。",
    feedback_ng: "NotebookLMは、自分でアップロードした資料（PDF・テキストなど）に基づいてAIが回答するツールです。今日の研修で実際に体験します！"
  }
];

const TYPES = [
  {
    min: 0, max: 19,
    icon: "🌱",
    type: "AI見習い",
    sub: "BEGINNER — これから伸びるタイプ",
    color: "#7ec8e3",
    desc: "生成AIはまだ身近ではないかもしれませんが、今日の研修がきっかけになります。AIを「使いこなす人」と「使わない人」の差はこれから急速に広がります。今日が最高のスタート地点です。",
    steps: ["まずChatGPTに1日1回質問してみる", "「プロンプト」という言葉を覚える", "今日の研修で実際に触って体感する"]
  },
  {
    min: 20, max: 49,
    icon: "🔍",
    type: "AI探偵",
    sub: "EXPLORER — 興味はあるが活用はこれから",
    color: "#00d4ff",
    desc: "AIの存在は知っていて興味もある。でも「どう業務に使えばいいか」がまだぼんやりしている段階です。今日の研修でその答えが見えてきます。知識と実践をつなぐチャンスです。",
    steps: ["業務の「めんどくさい作業」をAIに頼んでみる", "プロンプトに「条件」を加える練習をする", "NotebookLMで自社資料を読み込ませてみる"]
  },
  {
    min: 50, max: 79,
    icon: "⚡",
    type: "AIパートナー",
    sub: "PRACTITIONER — 日常的に活用できている",
    color: "#00ff9d",
    desc: "ChatGPTなどを日常的に使い、AIと協働できている段階です。あとは「業務特化の使い方」をマスターするとさらに価値が高まります。今日はNotebookLMなど新ツールも試してみてください。",
    steps: ["用途別にプロンプトをテンプレート化する", "NotebookLMで社内ナレッジを整理する", "チームへのAI活用を提案・展開してみる"]
  },
  {
    min: 80, max: 100,
    icon: "🚀",
    type: "AIエバンジェリスト",
    sub: "EVANGELIST — 先導できるレベル",
    color: "#ffd700",
    desc: "AI活用の理解度・実践度ともに高いレベルです。あなたの役割はここから「使う人」から「広める人」へのシフトです。今日の研修では周りの人のサポート役もお願いできそうです。",
    steps: ["社内でのAI活用ガイドラインを考える", "チームのAI研修ファシリテーターを担う", "画像生成・自動化など次の領域に挑戦する"]
  }
];

let current = 0;
let totalScore = 0;
let answered = false;

function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  const quiz = document.getElementById('quiz');
  quiz.style.display = 'flex';
  quiz.style.flexDirection = 'column';

  // Build progress pips
  const track = document.getElementById('progress-track');
  for (let i = 0; i < QUESTIONS.length; i++) {
    const pip = document.createElement('div');
    pip.className = 'progress-pip' + (i === 0 ? ' active' : '');
    pip.id = 'pip-' + i;
    track.appendChild(pip);
  }

  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = QUESTIONS[current];

  document.getElementById('q-number').textContent = `Q.${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('q-text').textContent = q.text;

  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i, btn);
    optEl.appendChild(btn);
  });

  document.getElementById('feedback-box').className = 'feedback-box';
  document.getElementById('feedback-box').textContent = '';
  document.getElementById('next-btn').className = 'next-btn';

  // Update pips
  for (let i = 0; i < QUESTIONS.length; i++) {
    const pip = document.getElementById('pip-' + i);
    if (i < current) pip.className = 'progress-pip done';
    else if (i === current) pip.className = 'progress-pip active';
    else pip.className = 'progress-pip';
  }

  document.getElementById('score-display').textContent = `PT: ${totalScore}`;

  // Animate in
  document.getElementById('q-text').style.animation = 'none';
  void document.getElementById('q-text').offsetWidth;
  document.getElementById('q-text').style.animation = 'fadeIn 0.3s ease';
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[current];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback-box');

  if (idx === q.correct) {
    btn.classList.add('correct');
    totalScore += q.points;
    document.getElementById('score-display').textContent = `PT: ${totalScore}`;
    fb.textContent = '✓ 正解！ +' + q.points + 'pt — ' + q.feedback_ok;
    fb.className = 'feedback-box ok show';
  } else {
    btn.classList.add('wrong');
    allBtns[q.correct].classList.add('correct');
    fb.textContent = '✗ 不正解 — ' + q.feedback_ng;
    fb.className = 'feedback-box ng show';
  }

  document.getElementById('next-btn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'flex';
  resultEl.style.flexDirection = 'column';

  const pct = Math.round((totalScore / 100) * 100);
  const type = TYPES.find(t => pct >= t.min && pct <= t.max) || TYPES[0];

  document.getElementById('result-icon').textContent = type.icon;
  document.getElementById('result-type').textContent = type.type;
  document.getElementById('result-type').style.color = type.color;
  document.getElementById('result-type').style.textShadow = `0 0 16px ${type.color}80`;
  document.getElementById('result-sub').textContent = type.sub;
  document.getElementById('score-final').textContent = `${totalScore} / 100 PT`;
  document.getElementById('result-desc').textContent = type.desc;

  // Next steps
  const stepsEl = document.getElementById('next-steps');
  type.steps.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'step-item';
    div.innerHTML = `<span class="step-num">${i+1}</span><span>${s}</span>`;
    stepsEl.appendChild(div);
  });

  // Animate score bar
  setTimeout(() => {
    document.getElementById('score-bar-fill').style.width = pct + '%';
  }, 300);
}

function restart() {
  current = 0;
  totalScore = 0;
  answered = false;
  document.getElementById('result').style.display = 'none';
  document.getElementById('next-steps').innerHTML = '';
  document.getElementById('progress-track').innerHTML = '';
  document.getElementById('score-bar-fill').style.width = '0';
  document.getElementById('intro').style.display = 'flex';
}
</script>
</body>
</html>
